{% extends "layout.html" %}

{% block title %}Register - BGB Bank{% endblock %}

{% block content %}
<section class="auth-form-container">
    <div class="card auth-card">
        <h2 class="card-title">Create a New Account</h2>
        <form action="{{ url_for('register') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="account_no">Account Number</label>
                <input type="text" id="account_no" name="account_no" placeholder="10-digit account number" required>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password"
                    placeholder="Re-enter your password" required>
            </div>
            <div class="form-group">
                <label for="balance">Initial Deposit (optional)</label>
                <input type="number" id="balance" name="balance" step="0.01" value="0">
            </div>
            <div class="mt-4 text-right">
                <button type="submit" class="btn btn-primary">Register</button>
            </div>
        </form>
        <p class="mt-4 text-center">
            Already have an account? <a href="{{ url_for('login') }}" class="link-text">Log in here</a>
        </p>
    </div>
</section>
{% endblock %}
