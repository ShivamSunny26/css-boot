{% extends "layout.html" %}

{% block title %}Forgot Password - BGB Bank{% endblock %}

{% block content %}
<section class="auth-form-container">
    <div class="card auth-card">
        <h2 class="card-title">Reset Your Password</h2>
        <form action="{{ url_for('forgot_password') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="account_no">Account Number</label>
                <input type="text" id="account_no" name="account_no" placeholder="Enter your 10-digit account number" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="Minimum 6 characters" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required>
            </div>
            <div class="mt-4 text-right">
                <button type="submit" class="btn btn-primary">Reset Password</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
