{% extends "layout.html" %}
{% block title %}Login - BGB Bank {% endblock %}

{% block content %}
<section class="auth-form-container">
    <div class="card auth-card">
        <h2 class="card-title">Login to Your Account</h2>
        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="account_no">
                    Account Number
                </label>
                <input type="text" id="account_no", name="account_no" placeholder="Enter your 10-digit account number" required>

            </div>
            <div class="form-group">
                <label for="password">
                    Password
                </label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="flex justify-between iems-center mt-4">
                <a href="{{ url_for('forgot_password') }}" class="link-text">
                    Forget Password?
                </a>
                <button type="submit" class="btn btn-primary">Log In</button>
            </div>

        </form>
        <p class="mt-4 text-center">
            Don't have an account? <a href="{{ url_for('register') }}" class="link-text">Register here</a>
        </p>
    </div>
</section>

{% endblock %}
